

name: 32 - Concurrency

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: production-deploy     
                                  
      cancel-in-progress: false    
                                    
                                    
                                    

    steps:
      - name: Deploy safely
        run: |
          echo "Only one of these can be running across the whole repo."
          sleep 30
          echo "Deploy finished cleanly."

  
